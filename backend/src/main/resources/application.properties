spring.application.name=MoneyManager

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


server.servlet.context-path=/api/v1.0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Email Configuration
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=587
spring.mail.username=${BREVO_USERNAME}
spring.mail.password=${BREVO_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.from=${BREVO_FROM_EMAIL}

spring.secret=${JWT_SECRET_KEY}

# JWT expiration time
# 30 seconds = 30000 milliseconds
# 1 minute   = 60000 milliseconds
# 3 minutes  = 180000 milliseconds
# 1 hour     = 3600000 milliseconds
# 3 hours    = 10800000 milliseconds
# 1 day      = 86400000 milliseconds
# 7 days     = 604800000 milliseconds
# 15 days    = 1296000000 milliseconds
# 1 month    = 2592000000 milliseconds

jwt.expiration=86400000
